<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FaithOn — Send PRAY</title>
  <meta name="description" content="Open SMS or WhatsApp and send PRAY to FaithOn." />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="theme-color" content="#F4ECDF" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper: #F4ECDF;
      --paper-soft: #FBF6EC;
      --ink: #1A1714;
      --ink-mute: #6E6358;
      --gold: #B98238;
      --gold-deep: #8E5F22;
      --whatsapp: #25D366;
      --whatsapp-dark: #1eb857;
      --shadow: 0 6px 24px rgba(26,23,20,.08);
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card{
      background: var(--paper-soft);
      border: 1px solid rgba(26,23,20,.08);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .mark{
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid rgba(26,23,20,.08);
      display: grid;
      place-items: center;
      font-size: 24px;
      color: var(--gold-deep);
    }
    h1{
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    p{
      color: var(--ink-mute);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink);
      color: var(--paper-soft);
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      padding: 16px 28px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .15s ease, opacity .15s ease;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn:active{transform: scale(.98)}
    .btn-whatsapp{
      background: var(--whatsapp);
      color: #fff;
    }
    .btn-whatsapp svg{ width:18px; height:18px; }
    .muted{
      margin-top: 20px;
      font-size: 12px;
      color: var(--ink-mute);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <h1>Send PRAY</h1>
    <p>Choose how you want to send <strong>PRAY</strong> to FaithOn and start your conversation.</p>

    <a id="sms-link" class="btn" href="sms:+19547950686?body=PRAY">Open Messages</a>

    <a id="wa-link" class="btn btn-whatsapp" href="https://wa.me/19547950686?text=PRAY" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      Open WhatsApp
    </a>

    <p class="muted">Both options send <strong>PRAY</strong> to start.</p>
  </main>

  <script>
    (function() {
      var link = document.getElementById('sms-link');
      var href = link.href;
      // Try to open the SMS app automatically on load.
      window.location.href = href;
      // On some browsers the automatic jump is blocked; the buttons remain.
    })();
  </script>
</body>
</html>
